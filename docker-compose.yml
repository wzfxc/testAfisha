services:
  secret-init:
    image: alpine:3.21
    container_name: afisha-secret-init
    restart: "no"
    command:
      - sh
      - -eu
      - -c
      - |
        if [ ! -s /secrets/internal_secret ]; then
          umask 022
          head -c 32 /dev/urandom | base64 | tr -d '\n' > /secrets/internal_secret
          chmod 0444 /secrets/internal_secret
        fi
    volumes:
      - internal_secret:/secrets

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: afisha-api
    restart: unless-stopped
    depends_on:
      secret-init:
        condition: service_completed_successfully
    expose:
      - "4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      INTERNAL_SECRET_FILE: /run/secrets/internal_secret
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-60}
      TRUST_PROXY_HOPS: 0
      CORS_ORIGINS: http://localhost:3000
      CACHE_TTL_MS: ${CACHE_TTL_MS:-60000}
      CACHE_MAX_ENTRIES: ${CACHE_MAX_ENTRIES:-500}
      DB_MIN_DELAY_MS: ${DB_MIN_DELAY_MS:-300}
      DB_MAX_DELAY_MS: ${DB_MAX_DELAY_MS:-800}
      SHUTDOWN_TIMEOUT_MS: 10000
      DATA_FILE: /app/runtime-data/events.json
      SEED_FILE: /app/data/events.seed.json
    volumes:
      - api_data:/app/runtime-data
      - internal_secret:/run/secrets:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: afisha-web
    restart: unless-stopped
    depends_on:
      secret-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      API_URL: http://api:4000
      API_TIMEOUT_MS: 5000
      INTERNAL_SECRET_FILE: /run/secrets/internal_secret
    volumes:
      - internal_secret:/run/secrets:ro

  proxy:
    image: nginx:1.27-alpine
    container_name: afisha-proxy
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "3000:3000"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  api_data:
  internal_secret:
