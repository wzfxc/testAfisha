services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: afisha-api
    restart: unless-stopped
    expose:
      - "4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      INTERNAL_SECRET: ${INTERNAL_SECRET:-afisha-prod-internal-secret-2026}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-60}
      TRUST_PROXY_HOPS: 0
      CORS_ORIGINS: http://localhost:3000
      CACHE_TTL_MS: ${CACHE_TTL_MS:-60000}
      CACHE_MAX_ENTRIES: ${CACHE_MAX_ENTRIES:-500}
      DB_MIN_DELAY_MS: ${DB_MIN_DELAY_MS:-300}
      DB_MAX_DELAY_MS: ${DB_MAX_DELAY_MS:-800}
      SHUTDOWN_TIMEOUT_MS: 10000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        INTERNAL_SECRET: ${INTERNAL_SECRET:-afisha-prod-internal-secret-2026}
    container_name: afisha-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      API_URL: http://api:4000
      INTERNAL_SECRET: ${INTERNAL_SECRET:-afisha-prod-internal-secret-2026}

  proxy:
    image: nginx:1.27-alpine
    container_name: afisha-proxy
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "3000:3000"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
